# Default local datasource (H2 in-memory). Override with DB_URL/DB_USERNAME/DB_PASSWORD for PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:h2:mem:stockwise;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Console (local debug)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable devtools restart to avoid duplicate-process DB lock issues in IDE runs.
spring.devtools.restart.enabled=false

# HTTP
server.port=${SERVER_PORT:8080}