name: Build & Test - StockWise

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: ['21']
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build backend with Maven
      run: |
        cd backend
        mvn clean package -DskipTests
      
    - name: Run backend tests
      run: |
        cd backend
        mvn test

  build-frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18.x']
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm install

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Run frontend tests (if applicable)
      continue-on-error: true
      run: |
        cd frontend
        npm test -- --passWithNoTests

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Check backend code style
      continue-on-error: true
      run: |
        cd backend
        mvn checkstyle:check 2>/dev/null || echo "Checkstyle not configured yet"

    - name: Report build status
      if: always()
      run: echo "✅ Backend build completed. ✅ Frontend build completed."
